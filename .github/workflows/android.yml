name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Native compass, portrait lock and version
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="portrait"|' "$MANIFEST"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cp native/*.java android/app/src/main/java/io/github/compass/app/
          ls android/app/src/main/java/io/github/compass/app/
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Use the app icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              if [ -f "$d/$n.png" ]; then
                cp www/icons/icon-maskable-512.png "$d/$n.png"
              fi
            done
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build and sign APK
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD --out ../compass.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../compass.apk
          else
            echo "No signing key found, building a debug APK instead."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../compass.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: compass-apk
          path: compass.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest compass.apk \
            --target "$GITHUB_SHA" \
            --title "Compass build ${{ github.run_number }}" \
            --notes "Latest Android APK. Install it directly on your phone." \
            --latest
